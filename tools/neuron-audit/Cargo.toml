[package]
name = "neuron-audit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "NNS neuron audit tool with controller-verified, auditable StartDissolving capability"
publish = false

[dependencies]
anyhow = "1"
candid = { version = "0.10", features = ["value"] }
clap = { version = "4", features = ["derive"] }
ic-agent = "0.49"
icrc-ledger-types = "0.2"
k256 = { version = "0.13", default-features = false, features = [
    "arithmetic",
    "ecdsa",
    "pkcs8",
    "std",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }


# Standalone crate: not part of the legacy workspace.
[workspace]
